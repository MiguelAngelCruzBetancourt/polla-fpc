name: notifications-cron

# Dispara periódicamente los jobs de notificaciones (drenaje de outbox +
# chequeo de horarios de partidos). Viven como route handlers en la app de
# Next.js desplegada en Vercel; hace falta un cron externo porque en serverless
# no hay proceso persistente y Vercel Cron en el plan Hobby solo corre 1 vez al
# día. Ver DEPLOY.md para el contexto completo.
#
# Requiere configurar en este repo (Settings > Secrets and variables > Actions):
#   - Variable NOTIFICATIONS_API_URL: URL pública de la app en Vercel.
#   - Secret NOTIFICATIONS_CRON_SECRET: mismo valor que CRON_SECRET en Vercel.
on:
  schedule:
    # Cada 5 minutos — GitHub Actions no garantiza puntualidad menor a esto de
    # todas formas. Ambos jobs son idempotentes (dedup por notificationLog /
    # outboxEvents.processedAt), así que ejecutarlos de más no duplica nada.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  trigger-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: Drenar outbox de notificaciones
        run: |
          curl -sf -X POST "${{ vars.NOTIFICATIONS_API_URL }}/api/internal/jobs/drain-outbox" \
            -H "X-Cron-Secret: ${{ secrets.NOTIFICATIONS_CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            --max-time 30

      - name: Chequear horarios de partidos
        if: always()
        run: |
          curl -sf -X POST "${{ vars.NOTIFICATIONS_API_URL }}/api/internal/jobs/check-schedule" \
            -H "X-Cron-Secret: ${{ secrets.NOTIFICATIONS_CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            --max-time 30
