name: Sync BetPlay schedule

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Call sync endpoint
        run: |
          curl -f -X POST "https://polla-fpc.vercel.app/api/sync/schedule" \
            -H "Authorization: Bearer ${{ secrets.SYNC_SECRET }}"
